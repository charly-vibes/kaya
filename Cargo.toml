[package]
name = "kaya"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/kaya"

[lib]
name = "kaya"
path = "src/lib.rs"

[[bin]]
name = "kaya"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
