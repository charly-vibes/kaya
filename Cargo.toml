[package]
name = "kaya-vibes"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/kaya"
readme = "README.md"
description = "A living record of exploration: compile the artifacts a project already produces into continuously generated, human-owned documentation"
keywords = ["documentation", "research", "provenance", "knowledge", "cli"]
categories = ["development-tools", "command-line-utilities"]
# The crate is the compiler; the research workspace, agent configuration, spec
# corpus and release tooling belong to the repository, not to consumers.
exclude = [
    ".agents",
    ".beads",
    ".genesis",
    ".gitignore",
    ".claude",
    ".codex",
    ".cursor",
    ".espectacular",
    ".github",
    ".kaya",
    ".wai",
    ".whisper",
    "book",
    "book.toml",
    "docs",
    "justfile",
    "lefthook.yml",
    "openspec",
    "scripts",
    "theme",
    "update-homebrew.py",
    "update-scoop.py",
    "versions.ddl.toml",
    "AGENTS.md",
    "CLAUDE.md",
    "RELEASING.md",
]

[lib]
name = "kaya"
path = "src/lib.rs"

[[bin]]
name = "kaya"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ulid = "1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
hegeltest = { version = "=0.52.7", features = ["static-engine"] }
